modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
logoFile="icon.png" #optional
description='''${mod_description}'''

# Forge
[[dependencies.${mod_id}]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

# Minecraft
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Farmer's Delight - optional. Provides alternative cooking pot / cutting board recipes.
# We must load AFTER them so their recipe types and item tags exist by the time our conditional
# recipes are parsed.
[[dependencies.${mod_id}]]
    modId="farmersdelight"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Salt: Renewed - optional. If present, our own salt content disables itself and theirs
# drives our seasoning system instead. See SaltCompat.
[[dependencies.${mod_id}]]
    modId="salt"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

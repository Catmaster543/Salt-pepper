# Which JVM the Gradle daemon runs on.
#
# This branch happens to configure on an older JVM because its Java 21 toolchain handles compilation
# independently - but that leaves it depending on whatever `java` is first on PATH. Stating the
# requirement makes it explicit and immune to the ambient JAVA_HOME, which has to differ across this
# repo's branches (Forge 1.20.1 needs an old JDK, the Loom branches need 21+).
#
# 21 matches the Java toolchain build.gradle already declares, so the daemon and javac agree.
#
# Declared by version rather than by path so Gradle locates or provisions a JDK itself.
toolchainVersion=21
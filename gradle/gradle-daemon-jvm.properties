# Which JVM the Gradle daemon runs on.
#
# This branch is the one that wants an OLD JVM, not a new one. Gradle 8.8 cannot run on a JDK as new
# as 25 - it aborts with "Unsupported class file major version 69" - so if JAVA_HOME is ever pointed
# at a recent JDK to satisfy the Loom branches, this branch breaks unless it states its own needs.
#
# 17 is also what Minecraft 1.20.1 targets, and build.gradle already declares a Java 17 toolchain for
# javac, so here the daemon JVM and the compile target agree.
#
# Declaring the requirement by version rather than by path means Gradle finds a suitable JDK itself
# rather than depending on whatever `java` happens to be first on PATH.
toolchainVersion=17

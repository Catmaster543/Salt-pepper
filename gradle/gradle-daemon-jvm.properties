# Which JVM the Gradle daemon itself runs on - NOT what the mod is compiled against.
#
# Loom 1.17 refuses to load on anything below Java 21, while this machine's PATH java is 17 and
# JAVA_HOME is unset, so a bare `gradlew runClient` would otherwise fail with
# "Dependency requires at least JVM runtime version 21. This build uses a Java 17 JVM."
#
# Declaring the requirement here makes Gradle go and find a suitable JDK by itself, so the build
# works without anyone having to set JAVA_HOME first. It is deliberately a version requirement
# rather than an absolute path, and it lives in this branch's tree rather than in the machine-wide
# ~/.gradle/gradle.properties - the Forge branch in this same directory uses Gradle 8.8, which
# breaks on a JDK this new, so the two branches must be able to disagree.
#
# Minecraft 1.20.1 still targets Java 17. That is enforced separately by the Java toolchain in
# build.gradle, which governs javac and the runClient/runServer JVM.
toolchainVersion=21

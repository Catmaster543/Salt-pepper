# Which JVM the Gradle daemon runs on.
#
# Without this, a bare `gradlew runClient` uses whatever `java` is first on PATH - Java 17 on the
# machine this was set up on - and fails with
# "Dependency requires at least JVM runtime version 21. This build uses a Java 17 JVM."
#
# 25 rather than 21, because this branch has two separate requirements and the daemon has to satisfy
# both at once:
#   - Loom refuses to load below Java 21.
#   - build.gradle compiles with `release = 25` and declares no Java toolchain, so javac is the daemon
#     JVM itself and must therefore be 25.
# Add a toolchain in build.gradle if those two ever need to diverge, as they do on the 1.20.1 branches
# where the daemon is 21 but javac and the dev runs are pinned to 17.
#
# Declaring the requirement by version rather than by path means Gradle finds a suitable JDK itself,
# downloading one into ~/.gradle/jdks if none is installed, so nobody has to set JAVA_HOME first.
# It lives in the branch tree on purpose: each branch of this mod targets a different Minecraft
# version with a different build tool, and they do not agree on a JVM.
toolchainVersion=25

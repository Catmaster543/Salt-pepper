# Which JVM the Gradle daemon runs on.
#
# Loom 1.17 refuses to load below Java 21, and this machine's PATH java is 17 with JAVA_HOME unset,
# so a bare `gradlew runClient` otherwise fails with
# "Dependency requires at least JVM runtime version 21. This build uses a Java 17 JVM."
#
# Declaring the requirement by version rather than by path means Gradle finds a suitable JDK itself -
# downloading one into ~/.gradle/jdks if none is installed - so nobody has to set JAVA_HOME first,
# on this machine or any other.
#
# This file is per-branch on purpose. Each branch of this mod targets a different Minecraft version
# with a different build tool, and they do not agree on a JVM: Forge 1.20.1 builds with Gradle 8.8,
# which does not support a JDK this new. Keeping the declaration in the branch tree lets each one
# state its own requirement instead of fighting over a single machine-wide JAVA_HOME.
#
# Minecraft 1.21.1 targets Java 21, so here the daemon JVM and the compile target happen to agree.
# On the 1.20.1 branches they deliberately do not: the daemon is 21 while javac and the dev runs are
# pinned to 17 by a toolchain in build.gradle.
toolchainVersion=21

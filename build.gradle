plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // Registers the "parchment" mapping channel with ForgeGradle. Must sit BELOW the
    // net.minecraftforge.gradle plugin. 1.2.0 is the current release on maven.parchmentmc.org.
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.20.1, so this mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Parchment layers community parameter names and javadocs on top of Mojang's official mappings.
    // Channel/version come from gradle.properties.
    mappings channel: mapping_channel, version: mapping_version

    // Required for this template to function - runs processResources on IDE output before launching.
    copyIdeResources = true

    // Default run configurations.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment.
            // "SCAN": For mods scan. "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Dev-environment only, and nothing to do with this mod's own code - it uses no mixins.
            //
            // A production mod jar dropped into run/mods carries a refmap that rewrites its mixin
            // targets to SRG names (m_36391_ and friends), because that is what a shipped game uses.
            // This dev run is mapped with Parchment on top of official names, so those targets resolve
            // against a Player that calls the method canEat and the mixin dies with
            // "Critical injection failure ... could not find any targets matching". Handing Mixin the
            // SRG -> named table ForgeGradle already generates lets it reverse the refmap at load time.
            //
            // Without this, Farmer's Delight (and anything else mixin-based) cannot be tested in dev.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // ForgeGradle automatically adds the Forge maven and Maven Central.

    // Local test-only mod jars. flatDir gives them coordinates so fg.deobf can remap them.
    flatDir { dir "${projectDir}/libs" }
}

dependencies {
    // Specify the version of Minecraft + Forge to use.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Test-only mods, loaded from libs/. These are NOT dependencies of the shipped mod - the Farmer's
    // Delight compat is JSON-only and there is no Java that imports it. runtimeOnly is deliberate: it
    // keeps them off the compile classpath so that invariant cannot be broken by accident.
    //
    // They must go through fg.deobf rather than being dropped into run/mods. A released mod jar is
    // compiled against SRG names (m_61090_, m_61124_, ...), while this dev run is mapped with Parchment
    // on top of official names (defaultBlockState, setValue, ...). Loading such a jar directly fails -
    // first its mixins cannot find their targets, and had they applied, every Minecraft call in the mod
    // would throw NoSuchMethodError. fg.deobf remaps the jar into the dev mappings first.
    // The coordinates below are just flatDir's view of the filenames in libs/; nothing is downloaded.
    // fg.deobf(files(...)) does NOT work - ForgeGradle can only deobfuscate artifacts that resolve
    // through a repository, so a bare file dependency is silently passed through un-remapped and fails
    // exactly as run/mods did.
    //
    // Each is guarded on the jar being present, so the build still works for anyone who has not
    // downloaded them. Drop a jar in libs/ and add a line here to test against another mod.
    [
            'FarmersDelight-1.20.1': '1.3.2',
            'jei-1.20.1-forge'     : '15.48.0.183',
            'appleskin-forge-mc1.20.1': '2.5.1',
    ].each { name, version ->
        if (file("${projectDir}/libs/${name}-${version}.jar").exists()) {
            runtimeOnly fg.deobf("libs:${name}:${version}")
        } else {
            logger.lifecycle("Test mod libs/${name}-${version}.jar not present - skipping")
        }
    }
}

// Expands the declared replace properties in mods.toml and pack.mcmeta.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate the jar.
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "saltandpepper" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Official Mojang mappings, not Yarn. The Forge 1.20.1 sources this branch starts from are written
    // against Mojmap names (Parchment only layers parameter names and javadocs on top of those), so
    // every class, method and field identifier the sources reference maps 1:1 and the port stays
    // mechanical.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. Required here: the mod uses the biome, resource-condition, item-group,
    // interaction-event, tooltip and convention-tag modules.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    // 1.20.1 runs on Java 17, unlike the 1.21.1 branches which are on 21. This governs the bytecode
    // level of the shipped jar: raising it to 21 produces class files that a player on Java 17 - the
    // normal runtime for 1.20.1 - cannot load at all. It is NOT the knob for "Loom wants Java 21";
    // that is the Gradle daemon's JVM, set in gradle/gradle-daemon-jvm.properties.
    it.options.release = 17
    it.options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    withSourcesJar()

    // Two different JVMs are in play and they must not be confused:
    //   - Loom 1.17 refuses to run on anything below Java 21, so the Gradle daemon itself needs 21+.
    //   - Minecraft 1.20.1 targets Java 17, so compilation and the dev runs must use 17.
    // A toolchain expresses exactly that: the daemon can be 21/25 while javac and runClient are 17.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

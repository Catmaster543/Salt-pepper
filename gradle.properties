# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
#
# The template ships minecraft_version=26.1 / fabric_api_version=0.145.1+26.1. This mod is on 26.1.2,
# and this port changes the loader only - not the Minecraft version - so both are taken from the
# matching 26.1.2 line instead. Loader, Loom, Gradle and Java are the template's values.
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the "id" in fabric.mod.json and the String constant in the main mod class.
mod_id=saltandpepper
# The human-readable display name for the mod.
mod_name=Salt & Pepper
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.2.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
maven_group=com.fiskerz.saltandpepper

# Dependencies
fabric_api_version=0.155.2+26.1.2

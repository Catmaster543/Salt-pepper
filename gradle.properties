# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# Versions taken from port-kit/fabric-example-mod-1.20.1/ - see https://fabricmc.net/develop
minecraft_version=1.20.1
loader_version=0.19.3
# The template ships 1.17-SNAPSHOT. Pinned to the concrete release from the same line that the
# Fabric 1.21.1 branch already builds with, so the toolchain cannot shift underneath the branch.
loom_version=1.17.17

# Mod Properties - carried over unchanged from the Forge 1.20.1 branch.
mod_id=saltandpepper
mod_name=Salt & Pepper
mod_license=MIT
mod_version=1.2.1
maven_group=com.fiskerz.saltandpepper
mod_authors=Fiskerz
mod_description=Adds salt and pepper to enhance your food just a tiny bit.

# Dependencies
fabric_api_version=0.92.11+1.20.1
